name: Android CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android build packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Test HINATA diagnostics protocol
        run: node --test tools/hinata-diagnostics/protocol.test.mjs

      - name: Package and verify artifacts
        run: |
          python3 tools/package_module.py
          python3 tools/check_artifacts.py

      - name: Prepare CI artifact
        run: |
          version_name=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          short_sha=${GITHUB_SHA::7}
          mkdir -p dist/ci
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ci/AimeSimulator-${version_name}-${short_sha}-debug.apk"
          cd dist/ci
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: AimeSimulator-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/ci/
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: AimeSimulator-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
